name: CI/CD - Build & Deploy Next.js

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create env for build
        run: |
          cat <<EOF > .env.local
          NEXT_PUBLIC_BE=${{ secrets.NEXT_PUBLIC_BE }}
          EOF

      - name: Build Next.js (standalone)
        run: npm run build

      - name: Package build
        run: |
          tar -czf sale-fe.tar.gz \
            .next/standalone \
            .next/static \
            public \
            package.json

      - name: Copy build to server
        run: |
          scp sale-fe.tar.gz \
            dev_01@10.110.20.107:/home/dev_01/sale-fe/

      - name: Extract build & restart service
        run: |
          ssh dev_01@10.110.20.107 <<'EOF'
          set -e
          cd /home/dev_01/sale-fe
          tar -xzf sale-fe.tar.gz
          sudo systemctl restart sale-fe
          EOF
