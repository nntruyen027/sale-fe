name: CD - Deploy Next.js (systemd)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (standalone)
        run: npm run build

      - name: Deploy build to app server
        run: |
          rsync -av \
            .next/standalone/ \
            dev_01@10.110.20.107:/home/dev_01/sale-fe/

          rsync -av \
            .next/static/ \
            dev_01@10.110.20.107:/home/dev_01/sale-fe/.next/static/

          rsync -av \
            public/ \
            dev_01@10.110.20.107:/home/dev_01/sale-fe/public/

      - name: Restart Next.js service
        run: |
          ssh dev_01@10.110.20.107 "sudo systemctl restart sale-fe"
